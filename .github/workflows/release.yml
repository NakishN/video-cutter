name: CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PyInstaller Bundle
        run: |
          pyinstaller --noconfirm video_cutter.spec --clean

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path dist/VideoCutter/* -DestinationPath dist/VideoCutter-Windows-x64.zip

      - name: Upload Build Artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: VideoCutter-Windows-x64
          path: dist/VideoCutter-Windows-x64.zip

      - name: Upload Release Asset (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoCutter-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Executable & AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pyinstaller mediapipe

      - name: Build AppImage and Linux Archive
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh || true
          cd dist
          tar -czvf VideoCutter-Linux-x64.tar.gz VideoCutter/

      - name: Upload Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: VideoCutter-Linux-x64
          path: |
            dist/VideoCutter-Linux-x64.tar.gz
            dist/VideoCutter-x86_64.AppImage

      - name: Upload Release Asset (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VideoCutter-Linux-x64.tar.gz
            dist/VideoCutter-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
